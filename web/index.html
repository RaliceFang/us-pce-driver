<h1 data-t="title">美國 PCE 物價貢獻度</h1><p class="sub" data-t="subtitle">把物價漲幅拆成每一項的貢獻，單位為百分點（pp）。</p><div id="status" role="status"></div>

<script>

ributions. Grey bars retain the residual, including rounding in published contributions. White: headline inflation. Cyan: core inflation (a growth rate, not a core contribution).',noteEstimate:'Detailed Fisher contributions are estimated from prices (2.4.4U) and expenditures (2.4.5U). Yearly contributions link monthly estimates. Grey bars retain the difference from official headline inflation.',tableNote:'Product table: reconstructed Fisher estimates. Shares are current-month nominal expenditure shares, not fixed weights. Deductions carry negative shares; their own price change keeps its sign. Net-expenditure rows without a price index show unavailable own-price changes.',treeNote:'Parents overlap their children; do not sum the full hierarchy.',selected:'Selected month',latest:'Latest data',search:'Search products',sum:'All leaf contributions',missing:'No matching products',stale:'Data are more than three months old. Run a data update.'}};
const hash=new URLSearchParams(location.hash.slice(1));

function valid(){if(!['zh','en'].includes(state.lang))state.lang='zh';if(!['mom','yoy'].includes(state.tf))state.tf='yoy';if(!D.breakdowns[state.bk])state.bk='basic4';if(!['12','36','60','120','all'].includes(state.range))state.range='60';if(!D.meta.months.includes(state.month))state.month=D.meta.latest}
function save(){const p=new URLSearchParams(state);history.replaceState(null,'','#'+p.toString());try{localStorage.setItem('pce-lang',state.lang)}catch{}}
function render(){valid();save();document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));$('lang').textContent=state.lang==='zh'?'English':'繁體中文';$('search').placeholder=T('search');$('meta').textContent=T('latest')+': '+D.meta.latest+' · '+D.meta.published.replace('Data published ','');$('bk').innerHTML=Object.entries(D.breakdowns).map(([k,v])=>`<option value="${k}">${esc(label(v))}</option>`).join('');$('bk').value=state.bk;$('month').innerHTML=[...D.meta.months].reverse().map(m=>`<option>${m}</option>`).join('');$('month').value=state.month;document.querySelectorAll('#tf button').forEach(b=>b.classList.toggle('on',b.dataset.value===state.tf));document.querySelectorAll('#range button').forEach(b=>b.classList.toggle('on',b.dataset.value===state.range));$('csv').href=(window.PCE_ASSET_BASE||'')+`data/pce_contrib_${state.bk}_${state.tf}.csv`;const i=D.meta.months.indexOf(state.month),bk=D.breakdowns[state.bk];$('headline').textContent=fmt(D.headline[state.tf][i],2)+'%';$('core').textContent=fmt(D.headline['core_'+state.tf][i],2)+'%';$('hlunit').textContent=$('coreunit').textContent=state.month+' · '+state.tf.toUpperCase()+' · SA';$('residual').textContent=fmt(bk.residual[state.tf][i])+' pp';const ranked=bk.components.filter(c=>c[state.tf][i]!=null).sort((a,b)=>b[state.tf][i]-a[state.tf][i]);const top=ranked.find(c=>c[state.tf][i]>0);$('top').textContent=top?fmt(top[state.tf][i])+' pp':'—';$('topname').textContent=top?label(top):T('none');$('chartnote').textContent=T(bk.method==='official'?'noteOfficial':'noteEstimate');$('tablenote').textContent=T('tableNote')+($('view').value==='tree'?' '+T('treeNote'):'');const now=new Date(),age=(now.getFullYear()-Number(D.meta.latest.slice(0,4)))*12+now.getMonth()+1-Number(D.meta.latest.slice(5));$('status').textContent=age>3?T('stale'):'';chart();table();}
function chart(){const bk=D.breakdowns[state.bk],tf=state.tf,all=D.meta.months,n=state.range==='all'?all.length:Number(state.range),start=Math.max(0,all.length-n),months=all.slice(start);const W=1400,H=450,L=65,R=20,U=24,B=44,w=W-L-R,h=H-U-B;let chartComponents=bk.components;
// Fine products share four category colors; aggregate bars without losing table detail.

for(let j=start;j<all.length;j++){let p=0,q=0;for(const c of cs){const v=c[tf][j];if(v==null)continue;if(v>=0)p+=v;else q+=v}hi=Math.max(hi,p,D.headline[tf][j]??0,D.headline['core_'+tf][j]??0);lo=Math.min(lo,q,D.headline[tf][j]??0,D.headline['core_'+tf][j]??0)}const margin=Math.max(.05,(hi-lo)*.1);hi+=margin;lo-=margin;const y=v=>U+(hi-v)/(hi-lo)*h,x=k=>L+(k+.5)*w/months.length,bw=Math.max(.5,w/months.length*.76);let out='';for(let k=0;k<=6;k++){const v=lo+(hi-lo)*k/6,yy=y(v);out+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#29313c"/><text x="${L-10}" y="${yy+4}" text-anchor="end" fill="#919aaa" font-size="12">${v.toFixed(tf==='mom'?2:1)}</text>`}out+=`<line x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}" stroke="#727d8c"/>`;
months.forEach((m,k)=>{const j=start+k;let p=0,q=0;for(const c of cs){const v=c[tf][j];if(v==null)continue;const a=v>=0?p:q,b=a+v;out+=`<rect x="${x(k)-bw/2}" y="${y(Math.max(a,b))}" width="${bw}" height="${Math.max(.15,Math.abs(y(a)-y(b)))}" fill="${c.color}"/>`;if(v>=0)p=b;else q=b}if(k===0||k===months.length-1||k%Math.max(1,Math.ceil(months.length/9))===0)out+=`<text x="${x(k)}" y="${H-16}" text-anchor="middle" fill="#919aaa" font-size="12">${m}</text>`});
for(const [key,color] of [[tf,'#f3f5f8'],['core_'+tf,'#5ecbe8']]){let path='',open=false;months.forEach((m,k)=>{const v=D.headline[key][start+k];if(v==null){open=false;return}path+=(open?'L':'M')+x(k)+','+y(v)+' ';open=true});out+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`}
out+=`<text x="${L}" y="16" fill="#919aaa" font-size="11">pp / % · ${tf.toUpperCase()} · SA</text>`;months.forEach((m,k)=>{out+=`<rect data-i="${start+k}" x="${L+k*w/months.length}" y="${U}" width="${w/months.length}" height="${h}" fill="transparent"/>`});$('chart').innerHTML=out;$('chart').setAttribute('aria-label',T('title')+' '+tf.toUpperCase());$('legend').innerHTML=cs.map(c=>`<span><i class="sw" style="background:${c.color}"></i>${esc(label(c))}</span>`).join('')+`<span style="color:#fff">━ ${T('headline')}</span><span style="color:#5ecbe8">━ ${T('core')}</span>`;
$('chart').onpointermove=e=>{const i=Number(e.target.dataset.i);if(!Number.isInteger(i)||e.target.dataset.i===undefined){$('tip').style.display='none';return}const parent=$('chart').parentElement,rect=parent.getBoundingClientRect();$('tip').innerHTML=`<b>${all[i]} · ${tf.toUpperCase()}</b>`+cs.map(c=>`<div class="r"><span style="color:${c.color}">${esc(label(c))}</span><span>${fmt(c[tf][i])} pp</span></div>`).join('')+`<hr><div class="r"><span>${T('headline')}</span><span>${fmt(D.headline[tf][i])}%</span></div><div class="r"><span>${T('core')}</span><span>${fmt(D.headline['core_'+tf][i])}%</span></div>`;$('tip').style.display='block';$('tip').style.left=Math.max(4,Math.min(e.clientX-rect.left+12,rect.width-$('tip').offsetWidth-4))+'px';$('tip').style.top=Math.max(4,Math.min(e.clientY-rect.top+12,rect.height-$('tip').offsetHeight-4))+'px'};$('chart').onpointerleave=()=>{$('tip').style.display='none'};$('chart').onclick=e=>{if(e.target.dataset.i!==undefined){state.month=all[Number(e.target.dataset.i)];render()}};}
function visibleItems(){const i=D.meta.months.indexOf(state.month),q=$('search').value.trim().toLowerCase();let items=D.items.filter(n=>n.id!=='1'&&($('view').value==='tree'||n.leaf)&&(!q||(n.zh+' '+n.en).toLowerCase().includes(q)));if($('view').value==='leaves')items.sort((a,b)=>((D.series[b.id][state.tf][i]??-Infinity)-(D.series[a.id][state.tf][i]??-Infinity))*(sortDescending?1:-1));return items}
function table(){$('detailcsv').href=(window.PCE_ASSET_BASE||'')+`data/pce_detail_${state.tf}.csv`;$('sort').textContent=T('contribution').replace('↓',sortDescending?'↓':'↑');$('sort').disabled=$('view').value==='tree';const i=D.meta.months.indexOf(state.month),items=visibleItems(),tree=$('view').value==='tree';$('rows').innerHTML=items.length?items.map(n=>{const s=D.series[n.id],c=s[state.tf][i];return `<tr><td style="padding-left:${tree?12+(n.level-1)*15:12}px">${esc(label(n))}${state.lang==='zh'?`<span class="en">${esc(n.en)}</span>`:''}</td><td class="num">${fmt(s.weight[i],2)}</td><td class="num">${fmt(s[state.tf==='mom'?'gm':'gy'][i],2)}</td><td class="num ${c>0?'pos':c<0?'neg':''}">${fmt(c)}</td><td>${T('estimate')}${!n.leaf?' · Σ':''}</td></tr>`}).join(''):`<tr><td colspan="5">${T('missing')}</td></tr>`;const sum=D.items.filter(n=>n.leaf).reduce((a,n)=>a+D.series[n.id][state.tf][i],0);$('tabletotal').textContent=`${T('selected')}: ${state.month} · ${T('sum')}: ${fmt(sum)} pp · ${T('residual')}: ${fmt(D.breakdowns.granular.residual[state.tf][i])} pp`;$('tablenote').textContent=T('tableNote')+(tree?' '+T('treeNote'):'');}

if(!D){document.querySelector('main').innerHTML='<p id="err">缺少資料。請先執行 python pce_contrib.py / Missing data: run python pce_contrib.py.</p>'}else{$('lang').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';render()};for(const id of ['tf','range'])$(id).onclick=e=>{if(e.target.dataset.value){state[id]=e.target.dataset.value;render()}};$('bk').onchange=e=>{state.bk=e.target.value;render()};$('month').onchange=e=>{state.month=e.target.value;render()};$('search').oninput=table;$('view').onchange=table;$('sort').onclick=()=>{sortDescending=!sortDescending;table()};window.addEventListener('hashchange',()=>{const p=new URLSearchParams(location.hash.slice(1));for(const k of Object.keys(state))if(p.has(k))state[k]=p.get(k);render()});render()}
